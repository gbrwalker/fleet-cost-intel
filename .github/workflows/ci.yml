name: CI
on:
  pull_request: {branches: [main]}
  push: {branches: [main]}
  workflow_dispatch:

# Action SHAs verified against the GitHub tags API on 2026-08-26, not copied
# from memory. A SHA that does not exist resolves to "unable to find version"
# and the job dies in Set up job, before a single step runs.
permissions:
  contents: read

concurrency:
  # `true` here, and FALSE on the pipeline. Cancelling CI mid-run costs a
  # minute; cancelling a pipeline mid-publication is how half-written files
  # are produced.
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # Actions pinned by SHA, not tag. A tag is mutable; a SHA is not.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with: {python-version: '3.12', cache: 'pip'}
      - run: pip install -r requirements.txt -r requirements-dev.txt
      - name: Lint
        run: ruff check .
      - name: Tests and coverage gate
        # 60, not the 35 the private system uses. That one carries code written
        # before its tests; this one has no legacy and is a showcase. The number
        # goes UP with real coverage and never down without a note in
        # docs/DECISIONS.md.
        run: pytest -q --cov=fleet_cost --cov-report=term-missing --cov-fail-under=60
      - name: Dependency audit
        run: pip-audit -r requirements.txt
      - name: Syntax check
        run: python -m compileall -q src tests
