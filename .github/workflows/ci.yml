name: CI
on:
  pull_request: {branches: [main]}
  push: {branches: [main]}
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # `true` here, and FALSE on the pipeline. Cancelling CI mid-run costs a
  # minute; cancelling a pipeline mid-publication is how half-written files
  # are produced.
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # Actions pinned by SHA, not tag. A tag is mutable; a SHA is not.
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with: {python-version: '3.12', cache: 'pip'}
      - run: pip install -r requirements.txt -r requirements-dev.txt
      - name: Lint
        run: ruff check .
      - name: Tests and coverage gate
        # 60, not the 35 the private system uses. That one carries code written
        # before its tests; this one has no legacy and is a showcase. The number
        # goes UP with real coverage and never down without a note in
        # docs/DECISIONS.md.
        run: pytest -q --cov=fleet_cost --cov-report=term-missing --cov-fail-under=60
      - name: Dependency audit
        run: pip-audit -r requirements.txt
      - name: Syntax check
        run: python -m compileall -q src tests
