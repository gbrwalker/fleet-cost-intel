name: Pipeline
on:
  schedule:
    # Wednesday 06:00 UTC-3, one day of slack after ANP's weekly publication.
    # CONFIRM the real publication day in the first week of operation and
    # adjust here — a cron chosen by guess is a cron that misses.
    - cron: '0 9 * * 3'
  workflow_dispatch:
    inputs:
      dry_run:
        description: Run every stage except the write
        type: boolean
        default: false

# Action SHAs verified against the GitHub tags API on 2026-08-26, not copied
# from memory. A SHA that does not exist resolves to "unable to find version"
# and the job dies in Set up job, before a single step runs.
permissions:
  contents: write   # the pipeline commits its own published output
  issues: write     # and opens an issue when it breaks

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false   # NEVER cancel mid-publication

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with: {python-version: '3.12', cache: 'pip'}
      - run: pip install -r requirements.txt
        # `-e .` because the package lives under src/ and is NOT on
        # sys.path by default. Running locally with the path injected by
        # hand hid this, and CI found it on the first real run — which is
        # the argument for having CI run the entry point, not just tests.
      - run: pip install -e .

      - name: Run pipeline
        run: |
          python -m fleet_cost ${{ inputs.dry_run && '--dry-run' || '' }}

      - name: Commit published output
        if: ${{ !inputs.dry_run }}
        run: |
          git config user.name  "fleet-cost-intel[bot]"
          git config user.email "actions@github.com"
          git add data/published data/raw/manifest.json
          git diff --staged --quiet || git commit -m "data: run ${{ github.run_id }}"
          git push

      # `failure() || cancelled()` and not just `failure()`. A job killed by
      # timeout-minutes finishes as `cancelled`, and `cancelled` does NOT
      # trigger `if: failure()`. In the private system this project models,
      # two runs died with no issue and no e-mail because of exactly this.
      - name: Open an issue when it breaks
        if: ${{ failure() || cancelled() }}
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        env:
          # Through env, not inline `${{ }}`, so the workflow expression never
          # lands inside a JS template literal — that is what broke the first
          # version of this file.
          JOB_STATUS: ${{ job.status }}
        with:
          script: |
            const url = `https://github.com/${context.repo.owner}/`
                      + `${context.repo.repo}/actions/runs/${context.runId}`;
            const body = [
              `Status: ${process.env.JOB_STATUS}`,
              url,
              'If this was a quality gate, nothing was written and the '
              + 'previous publication is intact.',
            ].join('\n\n');
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `Pipeline failed - run ${context.runId}`,
              body,
              labels: ['pipeline', 'automated'],
            });
